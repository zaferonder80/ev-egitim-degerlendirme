    button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}.login-hero{padding:56px clamp(28px,6vw,96px);color:white;background:radial-gradient(circle at 18% 16%,#0bb8b0 0 2%,transparent 17%),linear-gradient(135deg,#07345a,#0e5479);display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.2px}.brand-mark{width:40px;height:40px;border-radius:11px;background:#11c9bd;color:#07345a;display:grid;place-items:center;font-size:21px}.hero-copy{max-width:520px;margin:auto 0}.eyebrow{letter-spacing:1.4px;text-transform:uppercase;font-size:11px;font-weight:800;color:var(--teal)}.login-hero .eyebrow{color:#7be5db}.hero-copy h1{font-size:clamp(34px,4vw,57px);line-height:1.08;margin:16px 0}.hero-copy p{font-size:17px;opacity:.78;max-width:460px}.hero-foot{border-top:1px solid rgba(255,255,255,.2);padding-top:20px;display:flex;gap:25px;color:#cfebef;font-size:12px}.login-panel{display:grid;place-items:center;padding:32px}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.login-box{width:min(430px,100%)}.login-box h2{font-size:28px;margin:7px 0}.login-box>p{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:650;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd9e3;border-radius:9px;background:#fff;padding:11px 12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(12,166,166,.12)}.field textarea{min-height:82px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.full{grid-column:1/-1}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;transition:transform .16s,box-shadow .16s}.btn:active{transform:scale nt{padding:30px;max-width:1440px;margin:0 auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:23px}.page-head h1{font-size:27px;margin:4px 0}.page-head p{color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{padding:18px;min-height:115px}.metric small{color:var(--muted);display:block}.metric strong{font-size:30px;display:block;margin-top:8px}.metric .accent{color:var(--teal)}.grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel h3{margin:0 0 3px;font-size:16px}.panel .sub{font-size:12px;color:var(--muted);margin:0 0 18px}.chart{height:200px;display:flex;gap:11px;align-items:flex-end;padding:8px 0 0;border-bottom:1px solid var(--line)}.bar-wrap{display:grid;gap:5px;text-align:center;flex:1;color:var(--muted);font-size:11px}.bar{background:linear-gradient(180deg,#22b8b0,#0d9096);border-radius:5px 5px 0 0;min-height:4px}.donut-wrap{display:grid;place-items:center;min-height:200px}.donut{width:145px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--success) 0deg 100deg,#e35a70 100deg 360deg);position:relative}.donut:after{content:"Başarı\A dağılımı";white-space:pre;text-align:center;font-size:12px;font-weight:700;line-height:1.3;color:var(--ink);position:absolute;inset:25px;background:#fff;border-radius:50%;display:grid;place-items:center}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted);background:#f8fbfc}.table th,.table td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table tr:hover td{background:#fbfefe}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:750}.badge.success{color:#087553;background:#e4f7ef}.badge.warning{color:#9b6004;background:#fff3dc}.badge.danger{color:#b02c45;background:#ffedf0}.badge.info{color:#076b75;background:#e1f7f6}.badge.neutral{color:#46677b;background:#edf3f6}.split{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:13px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(2,26,44,.45);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px}.close{border:0;background:transparent;font-size:21px;color:var(--muted)}.criterion{border:1px solid var(--line);border-radius:11px;padding:15px;margin:10px 0}.criterion-head{display:flex;justify-content:space-between;gap:10px}.criterion h4{margin:0;font-size:14px}.criterion p{margin:4px 0 10px;color:var(--muted);font-size:12px}.score-set{display:flex;gap:6px}.score-set label{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}.score-set input{accent-color:var(--teal)}.info-list{display:grid;grid-template-columns:150px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.info-list div{padding:11px;border-bottom:1px solid var(--line)}.info-list div:nth-last-child(-n+2){border-bottom:0}.info-list .key{background:#f8fbfc;color:var(--muted);font-size:12px;font-weight:700}.notice{padding:11px 13px;background:#eefaf8;border:1px solid #caefe8;color:#17665d;border-radius:8px;font-size:12px;margin-bottom:13px}.danger-box{background:#fff4f5;border-color:#ffd8dd;color:#a2253b}.toast-area{position:fixed;right:20px;bottom:20px;z-index:50;display:grid;gap:8px}.toast{background:#07345a;color:#fff;padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);font-weight:600;animation:in .18s ease-out}.toast.error{background:#a82941}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.section-tabs{display:flex;gap:7px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:8px}.tab{border:0;background:#eef4f6;color:#45677a;padding:8px 10px;border-radius:7px;font-weight:700}.tab.active{background:#0c7f88;color:#fff}.report-card{border:1px solid var(--line);padding:15px;border-radius:11px;margin:10px 0}.small{font-size:12px;color:var(--muted)}.footer-note{margin-top:24px;color:var(--muted);font-size:12px}.mobile-menu{display:none}@media(max-width:900px){.login{grid-template-columns:1fr}.login-hero{display:none}.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;width:236px;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.mobile-menu{display:inline-block}.metrics{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.content{padding:20px}.topbar{padding:0 17px}.form-grid{grid-template-columns:1fr}.info-list{grid-template-columns:1fr}.info-list .key{padding-bottom:2px}.info-list div{padding:8px 11px}.info-list div:nth-last-child(2){border-bottom:1px solid var(--line)}}
  </style>

  <script>
  (()=>{
    const KEY='ev-egitim-offline-v1',SESSION='ev-egitim-offline-user';
    const CRITERIA=[
      ['K1','İçerik doğruluğu','Bilgilerin güncelliği, doğruluğu ve kaynaklara dayanması.'],['K2','Öğrenme amaçları','Amaçların açık, ölçülebilir ve içerikle uyumlu olması.'],['K3','Hedef kitle uyumu','Örneklerin ve dilin hedef kitlenin ihtiyaçlarına uygunluğu.'],['K4','Yapı ve akış','İçeriğin mantıksal sırası ve öğrenmeyi destekleyen akışı.'],['K5','Etkileşim','Katılımcı etkileşimi, uygulama ve geri bildirim unsurları.'],['K6','Görsel tasarım','Görsel hiyerarşi, okunabilirlik ve erişilebilirlik.'],['K7','Ölçme-değerlendirme','Öğrenme hedeflerini ölçen soru ve uygulamaların niteliği.'],['K8','Uygulanabilirlik','İçeriğin iş ortamına aktarılabilirliği ve faydası.']
    ];
    const day=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    const seed=()=>({
      users:[
        {id:1,name:'Admin Yönetici',email:'admin.demo@ev.local',role:'ADMIN',active:true,password:'Demo!2026Egitim',lastLogin:null},
        {id:2,name:'Ayşe Aktar',email:'ayse.demir@ev.local',role:'EVALUATOR',active:true,password:'Demo!2026Egitim',lastLogin:null},
        {id:3,name:'Berk Kaya',email:'berk.kaya@ev.local',role:'EVALUATOR',active:true,password:'Demo!2026Egitim',lastLogin:null},
        {id:4,name:'Deniz Aras',email:'deniz.aras@ev.local',role:'EVALUATOR',active:true,password:'Demo!2026Egitim',lastLogin:null},
        {id:5,name:'Zafer Önder',email:'zafer.onder@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:6,name:'Selin Merve Ağca',email:'selinmerve.agca@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:7,name:'Şeyda Gülkokar',email:'seyda.topcu@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:8,name:'Yeşim Sandıkçı',email:'yesim.sandikci@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:9,name:'Ebru Çelik',email:'ebru.celik@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:10,name:'Tuba Tapar',email:'tuba.tapar@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:11,name:'Pınar Tunçsav',email:'pinar.tuncsav@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:12,name:'Fatma Çardak',email:'fatma.cardak@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:13,name:'Nazire Erton',email:'nazire.erton@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null},
        {id:14,name:'Onur İzbul',email:'onur.izbul@lcwaikiki.com',role:'EVALUATOR',active:true,password:'Demodegerlendirme123!',lastLogin:null}
      ],
      trainings:[
        {id:101,title:'Bilgi Güvenliği Farkındalığı',code:'BGF-2026-01',description:'Kurumsal bilgi varlıklarının korunması ve güvenli davranış ilkeleri.',target:'Tüm çalışanlar',objectives:'Güvenli parola, oltalama farkındalığı ve veri sınıflandırma davranışını geliştirmek.',duration:'90 dakika',owner:'Bilgi Güvenliği Birimi',link:'',attachment:'bgf-egitim-sunumu.pdf',version:'1.2',date:'2026-08-01',archived:false},
        {id:102,title:'Etkili Geri Bildirim',code:'IK-2026-04',description:'Yapıcı geri bildirim kültürü ve yöneticilik uygulamaları.',target:'Yönetici adayları',objectives:'Gözlem temelli, somut ve gelişim odaklı geri bildirim vermek.',duration:'120 dakika',owner:'İnsan ve Kültür',link:'',attachment:'',version:'1.0',date:'2026-08-05',archived:false},
        {id:103,title:'Müşteri Deneyimi Temelleri',code:'MDS-2026-02',description:'Müşteri temas noktalarında tutarlı deneyim yaratma ilkeleri.',target:'Mağaza ekipleri',objectives:'Müşteri ihtiyacını doğru anlamak ve çözüm odaklı iletişim kurmak.',duration:'75 dakika',owner:'Müşteri Deneyimi',link:'',attachment:'',version:'2.1',date:'2026-07-15',archived:false}
      ],
      assignments:[
        {id:201,trainingId:101,evaluatorId:2,due:day(3),status:'PENDING',createdAt:day(-2)},
        {id:202,trainingId:102,evaluatorId:3,due:day(8),status:'COMPLETED',createdAt:day(-6)},
        {id:203,trainingId:103,evaluatorId:4,due:day(1),status:'PENDING',createdAt:day(-1)}
      ],
      evaluations:[{id:301,assignmentId:202,status:'COMPLETED',responses:[4,4,5,4,3,4,4,4],comments:['Güncel kaynaklar yerinde.','Amaçlar ölçülebilir.','Hedef kitleye uygun.','Akış anlaşılır.','Uygulama örnekleri artırılabilir.','Görsel dil tutarlı.','Kısa uygulama ölçümü güçlü.','Sahada kullanılabilir.'],updatedAt:day(-1)}],
      notifications:[],audit:[]
    });
    let db=load();let user=JSON.parse(sessionStorage.getItem(SESSION)||'null');let page='dashboard';let selectedAssignment=null;
    function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}
    function save(){localStorage.setItem(KEY,JSON.stringify(db))}
    function esc(v=''){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
    function getTraining(id){return db.trainings.find(x=>x.id===+id)}function getUser(id){return db.users.find(x=>x.id===+id)}function getAssignment(id){return db.assignments.find(x=>x.id===+id)}function evaluator(id){return getUser(id)?.name||'—'}
    function newId(list){return Math.max(0,...list.map(x=>x.id))+1}function score(ev){return ev?.responses?.length?ev.responses.reduce((a,b)=>a+b,0)/ev.responses.length:0}
    function status(s){let c=s==='COMPLETED'?'success':s==='DRAFT'?'warning':s==='ARCHIVED'?'neutral':'info';let t={COMPLETED:'Tamamlandı',DRAFT:'Taslak',PENDING:'Bekliyor',ARCHIVED:'Arşivde'}[s]||s;return `<span class="badge ${c}">${t}</span>`}
    function date(v){return v?new Intl.DateTimeFormat('tr-TR',{dateStyle:'medium'}).format(new Date(v+'T12:00:00')):'—'}function now(){return new Date().toLocaleString('tr-TR')}
    function toast(text,error=false){const x=document.createElement('div');x.className='toast'+(error?' error':'');x.textContent=text;document.querySelector('#toastArea').append(x);setTimeout(()=>x.remove(),3500)}
    function audit(action,detail){db.audit.unshift({id:newId(db.audit),when:now(),actor:user?.name||'Sistem',action,detail});save()}
    function upcoming(){if(!user)return[];let base=user.role==='ADMIN'?db.assignments:db.assignments.filter(a=>a.evaluatorId===user.id);return base.filter(a=>a.status!=='COMPLETED'&&Math.ceil((new Date(a.due)-new Date())/86400000)<=3)}
    function notify(){const items=upcoming();items.forEach(a=>{let key='due-'+a.id;if(!db.notifications.some(n=>n.key===key)){db.notifications.unshift({id:newId(db.notifications),key,text:`${getTraining(a.trainingId).title} değerlendirmesinin son tarihi yaklaşıyor.`,read:false,when:now()})}});save();return db.notifications.filter(n=>!n.read)}
    function layout(){if(!user){renderLogin();return}let notices=notify();let nav=user.role==='ADMIN'?[['dashboard','▦','Genel Bakış'],['trainings','◈','Eğitimler'],['users','♙','Kullanıcılar'],['assignments','✓','Atamalar'],['reports','▤','Raporlar'],['audit','◷','Denetim Kayıtları']]:[['dashboard','▦','Genel Bakış'],['assignments','✓','Atamalarım']];document.querySelector('#root').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark">▣</span><span>E/V SİSTEMİ<br><small>Eğitim Değerlendirme</small></span></div><div class="nav-heading">YÖNETİM</div>${nav.map(n=>`<button class="nav-btn ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="nav-icon">${n[1]}</span>${n[2]}</button>`).join('')}<div class="sidebar-bottom"><button class="nav-btn ${page==='profile'?'active':''}" onclick="go('profile')"><span class="nav-icon">◉</span>Profil</button><div class="user-chip"><b>${esc(user.name)}</b><small>${user.role==='ADMIN'?'Yönetici':'Değerlendirici'}</small></div><button class="nav-btn" onclick="logout()"><span class="nav-icon">↪</span>Güvenli çıkış</button></div></aside><main class="main"><header class="topbar"><div class="topbar-title"><small>${user.role==='ADMIN'?'Yönetim merkezi':'Değerlendirme çalışma alanı'}</small><b>Hoş geldiniz, ${esc(user.name.split(' ')[0])}</b></div><div class="top-actions"><button class="mobile-menu icon-btn" onclick="document.querySelector('#sidebar').classList.toggle('open')">☰</button><button class="icon-btn" onclick="showNotifications()">♧${notices.length?`<span class="count">${notices.length}</span>`:''}</button><button class="btn btn-secondary btn-sm" onclick="go('profile')">⚙ Profil</button></div></header><div class="content" id="content"></div></main></div>`;renderPage()}
    function pageHead(label,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
    function renderPage(){let c=document.querySelector('#content');if(!c)return;if(page==='dashboard')c.innerHTML=user.role==='ADMIN'?adminDashboard():evaluatorDashboard();else if(page==='trainings')c.innerHTML=trainingsPage();else if(page==='users')c.innerHTML=usersPage();else if(page==='assignments')c.innerHTML=assignmentsPage();else if(page==='reports')c.innerHTML=reportsPage();else if(page==='audit')c.innerHTML=auditPage();else if(page==='profile')c.innerHTML=profilePage();else if(page==='evaluate')c.innerHTML=evaluationPage();}
    function adminDashboard(){let completed=db.assignments.filter(a=>a.status==='COMPLETED').length,all=db.assignments.length,evals=db.evaluations.filter(e=>e.status==='COMPLETED');let averages=CRITERIA.map((_,i)=>evals.length?Math.round(evals.reduce((s,e)=>s+(e.responses[i]||0),0)/evals.length*20):0);return `${pageHead('Yönetim göstergesi','Eğitim değerlendirme özeti','Tarayıcınızda tutulan değerlendirme verilerinin genel görünümü.')}<div class="metrics"><div class="card metric"><small>Toplam eğitim</small><strong>${db.trainings.length}</strong></div><div class="card metric"><small>Aktif değerlendirme</small><strong>${all}</strong></div><div class="card metric"><small>Tamamlanan</small><strong class="accent">${completed}</strong></div><div class="card metric"><small>Tamamlanma oranı</small><strong>${all?Math.round(completed/all*100):0}%</strong></div></div><div class="grid-2"><section class="card panel"><h3>Kriter bazında puan ortalaması</h3><p class="sub">Tamamlanmış değerlendirmeler üzerinden hesaplanır.</p><div class="chart">${averages.map((v,i)=>`<div class="bar-wrap"><span>${v||0}</span><div class="bar" style="height:${v||4}%"></div><span>K${i+1}</span></div>`).join('')}</div></section><section class="card panel"><h3>Başarı dağılımı</h3><p class="sub">Tamamlanan eğitimlerin görünümü.</p><div class="donut-wrap"><div class="donut"></div><p class="small">Ortalama puanı 70 ve üzeri eğitimler başarılı kabul edilir.</p></div></section></div><section class="card panel" style="margin-top:16px"><div class="split"><div><h3>Öncelikli değerlendirmeler</h3><p class="sub">Son üç gün içinde teslim edilmesi gereken atamalar.</p></div><button class="btn btn-secondary btn-sm" onclick="go('assignments')">Atamaları yönet</button></div>${assignmentRows(upcoming(),true)}</section>`}
    function evaluatorDashboard(){let mine=db.assignments.filter(a=>a.evaluatorId===user.id), done=mine.filter(a=>a.status==='COMPLETED').length, draft=mine.filter(a=>a.status==='DRAFT').length;return `${pageHead('Değerlendirici alanı','Çalışma özetiniz','Atanan eğitimleri değerlendirin, taslaklarınızı kaydedin ve tamamlayın.',`<button class="btn btn-primary" onclick="go('assignments')">Atamaları görüntüle</button>`)}<div class="metrics"><div class="card metric"><small>Bekleyen</small><strong>${mine.filter(a=>a.status==='PENDING').length}</strong></div><div class="card metric"><small>Taslak</small><strong>${draft}</strong></div><div class="card metric"><small>Tamamlanan</small><strong class="accent">${done}</strong></div><div class="card metric"><small>Son 3 gün</small><strong>${upcoming().length}</strong></div></div><section class="card panel" style="margin-top:16px"><h3>Öncelikli değerlendirmeler</h3><p class="sub">Son teslim tarihine üç gün veya daha az kalan atamalar.</p>${assignmentRows(upcoming(),false)}</section>`}
    function assignmentRows(list,admin){if(!list.length)return '<div class="empty">Şu anda öncelikli değerlendirme bulunmuyor.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Eğitim</th>${admin?'<th>Değerlendirici</th>':''}<th>Son tarih</th><th>Durum</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${esc(getTraining(a.trainingId)?.title)}</b><br><span class="small">${esc(getTraining(a.trainingId)?.code)}</span></td>${admin?`<td>${esc(evaluator(a.evaluatorId))}</td>`:''}<td>${date(a.due)}</td><td>${status(a.status)}</td><td><button class="btn btn-secondary btn-sm" onclick="openAssignment(${a.id})">${admin?'İncele':'Değerlendir'}</button></td></tr>`).join('')}</tbody></table></div>`}
    function trainingsPage(){return `${pageHead('Eğitim yönetimi','Eğitimler','Eğitim künyesini, içerik ayrıntılarını ve sürüm bilgisini yönetin.',`<button class="btn btn-primary" onclick="trainingModal()">+ Yeni eğitim</button>`)}<section class="card panel">${db.trainings.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Kod</th><th>Eğitim</th><th>Hedef kitle</th><th>Sürüm</th><th>Durum</th><th></th></tr></thead><tbody>${db.trainings.map(t=>`<tr><td>${esc(t.code)}</td><td><b>${esc(t.title)}</b><br><span class="small">${esc(t.owner)}</span></td><td>${esc(t.target)}</td><td>${esc(t.version)}</td><td>${t.archived?status('ARCHIVED'):status('PENDING')}</td><td class="actions"><button class="btn btn-secondary btn-sm" onclick="trainingModal(${t.id})">Düzenle</button><button class="btn btn-plain btn-sm" onclick="archiveTraining(${t.id})">${t.archived?'Yeniden aç':'Arşivle'}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz eğitim eklenmedi.</div>'}</section>`}
    function usersPage(){return `${pageHead('Kullanıcı yönetimi','Kullanıcılar','Yerel cihazdaki roller, hesap durumları ve demo erişimleri.',`<button class="btn btn-primary" onclick="userModal()">+ Kullanıcı ekle</button>`)}<section class="card panel"><div class="notice">Bu çevrimdışı sürümde kullanıcı kayıtları yalnızca bu tarayıcının yerel depolamasında tutulur.</div><div class="table-wrap"><table class="table"><thead><tr><th>Ad soyad</th><th>E-posta</th><th>Rol</th><th>Durum</th><th>Son giriş</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${u.role==='ADMIN'?'<span class="badge info">Yönetici</span>':'<span class="badge neutral">Değerlendirici</span>'}</td><td>${u.active?'<span class="badge success">Aktif</span>':'<span class="badge danger">Pasif</span>'}</td><td>${u.lastLogin||'—'}</td><td class="actions"><button class="btn btn-secondary btn-sm" onclick="userModal(${u.id})">Düzenle</button><button class="btn btn-plain btn-sm" onclick="toggleUser(${u.id})">${u.active?'Pasifleştir':'Etkinleştir'}</button><button class="btn btn-plain btn-sm" onclick="resetPassword(${u.id})">Şifre sıfırla</button></td></tr>`).join('')}</tbody></table></div></section>`}
    function assignmentsPage(){let list=user.role==='ADMIN'?db.assignments:db.assignments.filter(a=>a.evaluatorId===user.id);let action=user.role==='ADMIN'?`<button class="btn btn-primary" onclick="assignmentModal()">+ Değerlendirici ata</button>`:'';return `${pageHead(user.role==='ADMIN'?'Atama yönetimi':'Atamalarım',user.role==='ADMIN'?'Değerlendirici atamaları':'Atanan eğitimler',user.role==='ADMIN'?'Eğitimleri değerlendiricilere atayın ve teslim tarihlerini yönetin.':'Eğitim Bilgileri sekmesinden yönetici tarafından girilen ayrıntıları görüntüleyin.',action)}<section class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Eğitim</th>${user.role==='ADMIN'?'<th>Değerlendirici</th>':''}<th>Son tarih</th><th>Durum</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${esc(getTraining(a.trainingId)?.title)}</b><br><span class="small">${esc(getTraining(a.trainingId)?.code)}</span></td>${user.role==='ADMIN'?`<td>${esc(evaluator(a.evaluatorId))}</td>`:''}<td>${date(a.due)}</td><td>${status(a.status)}</td><td class="actions"><button class="btn btn-secondary btn-sm" onclick="openAssignment(${a.id})">${user.role==='ADMIN'?'İncele':'Değerlendir'}</button>${user.role==='ADMIN'?`<button class="btn btn-danger btn-sm" onclick="removeAssignment(${a.id})">Kaldır</button>`:''}</td></tr>`).join('')}</tbody></table></div></section>`}
    function reportsPage(){let done=db.assignments.filter(a=>a.status==='COMPLETED');return `${pageHead('Raporlama','Değerlendirme raporları','Tarayıcının yazdırma iletişim kutusundan raporları PDF olarak kaydedin.')}<section class="card panel"><div class="notice">“PDF aç” seçeneği, bağımlılık gerektirmeden yazdırma görünümünü açar. Açılan pencerede <b>PDF olarak kaydet</b> seçilebilir.</div>${done.length?done.map(a=>{let e=db.evaluations.find(x=>x.assignmentId===a.id);let t=getTraining(a.trainingId);return `<div class="report-card"><div class="split"><div><b>${esc(t.title)}</b><br><span class="small">${esc(t.code)} · ${esc(evaluator(a.evaluatorId))} · Ortalama ${score(e).toFixed(2)}/5</span></div><button class="btn btn-primary btn-sm" onclick="openReport(${a.id})">PDF aç</button></div></div>`}).join(''):'<div class="empty">Tamamlanmış değerlendirme raporu yok.</div>'}</section>`}
    function auditPage(){return `${pageHead('İzlenebilirlik','Denetim kayıtları','Bu cihazdaki önemli yerel işlemler zaman damgası ile kaydedilir.')}<section class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Zaman</th><th>Kullanıcı</th><th>İşlem</th><th>Ayrıntı</th></tr></thead><tbody>${db.audit.length?db.audit.map(a=>`<tr><td>${esc(a.when)}</td><td>${esc(a.actor)}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.detail)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Henüz yerel işlem kaydı yok.</td></tr>'}</tbody></table></div></section>`}
    function profilePage(){return `${pageHead('Kullanıcı profili','Profil bilgileriniz','Bilgiler salt okunur tutulur; yalnızca parolanızı değiştirebilirsiniz.')}<div class="grid-2"><section class="card panel"><h3>Kullanıcı bilgileri</h3><p class="sub">Yerel oturum kaydından alınır.</p><div class="info-list"><div class="key">Ad soyad</div><div>${esc(user.name)}</div><div class="key">E-posta</div><div>${esc(user.email)}</div><div class="key">Rol</div><div>${user.role==='ADMIN'?'Yönetici':'Değerlendirici'}</div><div class="key">Hesap durumu</div><div>${user.active?'Aktif':'Pasif'}</div><div class="key">Son giriş</div><div>${getUser(user.id).lastLogin||'—'}</div></div></section><section class="card panel"><h3>Parola değiştir</h3><p class="sub">Yeni parolanız en az 12 karakter; büyük harf, küçük harf, sayı ve özel karakter içermelidir.</p><form onsubmit="changePassword(event)"><div class="field"><label>Mevcut şifre</label><input id="oldPassword" type="password" required></div><div class="field"><label>Yeni şifre</label><input id="newPassword" type="password" required></div><button class="btn btn-primary" type="submit">Şifreyi güncelle</button></form></section></div><section class="card panel" style="margin-top:16px"><h3>Yerel veri yönetimi</h3><p class="sub">Taşınabilirlik için tüm veriyi dışa aktarabilir veya başka bir çevrimdışı kopyadan içeri alabilirsiniz.</p><div class="actions"><button class="btn btn-secondary" onclick="exportData()">Veriyi dışa aktar</button><label class="btn btn-secondary">Veriyi içe aktar<input type="file" accept="application/json" onchange="importData(event)" hidden></label><button class="btn btn-danger" onclick="resetData()">Yerel veriyi sıfırla</button></div><p class="offline-note">Önemli: Bu dosya tarayıcıda ve ağ olmadan çalışır. Veriler cihazdaki LocalStorage alanında tutulduğu için farklı tarayıcılar ve kullanıcılar arasında senkronize edilmez; sunucu tarafı yetkilendirme, e-posta ve zamanlanmış işlevler sağlanamaz.</p></section>`}
    function evaluationPage(){let a=getAssignment(selectedAssignment);if(!a){page='assignments';renderPage();return''}let t=getTraining(a.trainingId),existing=db.evaluations.find(e=>e.assignmentId===a.id)||{responses:Array(8).fill(0),comments:Array(8).fill('')};if(user.role==='ADMIN')return `${pageHead('Atama inceleme','Değerlendirme kaydı',`${t.title} için kaydedilen değerlendirme bilgisi.`)}<section class="card panel">${renderEvaluationReadOnly(a,existing)}</section>`;return `${pageHead('Değerlendirme',esc(t.title),'Sekiz kriteri puanlayın, gözlemlerinizi yazın ve taslak ya da tamamlanmış kayıt olarak kaydedin.',`<button class="btn btn-secondary" onclick="trainingInfo(${t.id})">Eğitim Bilgileri</button>`)}<section class="card panel"><div class="section-tabs"><button class="tab active">Değerlendirme formu</button><button class="tab" onclick="trainingInfo(${t.id})">Eğitim Bilgileri</button></div>${a.status==='COMPLETED'?`<div class="notice">Bu değerlendirme tamamlanmıştır ve salt okunur görüntülenir.</div>${renderEvaluationReadOnly(a,existing)}`:`<form onsubmit="saveEvaluation(event,${a.id},'COMPLETED')">${CRITERIA.map((c,i)=>`<div class="criterion"><div class="criterion-head"><div><h4>${c[0]} · ${c[1]}</h4><p>${c[2]}</p></div><div class="score-set">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="score${i}" value="${n}" ${existing.responses[i]===n?'checked':''} required>${n}</label>`).join('')}</div></div><div class="field"><label for="comment${i}">Kriter yorumu</label><textarea id="comment${i}" placeholder="Gözleminizi ve geliştirme önerinizi yazın.">${esc(existing.comments[i]||'')}</textarea></div></div>`).join('')}<div class="split"><button type="button" class="btn btn-secondary" onclick="saveEvaluation(event,${a.id},'DRAFT')">Taslak kaydet</button><button type="submit" class="btn btn-primary">Değerlendirmeyi tamamla</button></div></form>`}</section>`}
    function renderEvaluationReadOnly(a,e){let t=getTraining(a.trainingId);return `<div class="split"><div><h3>${esc(t.title)}</h3><p class="sub">${status(a.status)} · Ortalama puan: <b>${score(e).toFixed(2)}/5</b></p></div><button class="btn btn-secondary btn-sm" onclick="trainingInfo(${t.id})">Eğitim Bilgileri</button></div>${CRITERIA.map((c,i)=>`<div class="criterion"><div class="criterion-head"><div><h4>${c[0]} · ${c[1]}</h4><p>${esc(e.comments[i]||'Yorum girilmedi.')}</p></div><span class="badge info">${e.responses[i]||0}/5</span></div></div>`).join('')}`}
    function renderLogin(){document.querySelector('#root').innerHTML=`<div class="login"><section class="login-hero"><div class="brand"><span class="brand-mark">▣</span><span>E/V SİSTEMİ<br><small>Eğitim İçerik Değerlendirme</small></span></div><div class="hero-copy"><div class="eyebrow">Kaliteyi görünür kılın</div><h1>Eğitim içeriklerinizi kanıta dayalı biçimde değerlendirin.</h1><p>Standartlaştırılmış kriterler, izlenebilir iş akışları ve anlamlı raporlarla eğitim kalitesini çevrimdışı yönetin.</p></div><div class="hero-foot"><span>◉ Rol bazlı arayüz</span><span>▣ Yerel veri kalıcılığı</span></div></section><section class="login-panel"><form class="login-box" onsubmit="login(event)"><div class="eyebrow">Çevrimdışı erişim</div><h2>Giriş yapın</h2><p>Bu bilgisayarda tutulan yerel verilere erişin.</p><div class="field"><label>E-posta adresi</label><input id="loginEmail" type="email" value="admin.demo@ev.local" required></div><div class="field"><label>Şifre</label><input id="loginPassword" type="password" value="Demo!2026Egitim" required></div><button class="btn btn-primary" type="submit">Güvenli giriş</button><div class="demo-note"><b>Demo hesapları</b><br>admin.demo@ev.local veya ayse.demir@ev.local<br>Şifre: <b>Demo!2026Egitim</b></div><div class="offline-note">Bu tek HTML sürümü internet bağlantısı olmadan açılır. Güvenli çok kullanıcılı kullanım için sunucu tabanlı sürümü kullanın.</div></form></section></div>`}
    window.login=(ev)=>{ev.preventDefault();let email=document.querySelector('#loginEmail').value.trim().toLowerCase(),pass=document.querySelector('#loginPassword').value;let found=db.users.find(u=>u.email.toLowerCase()===email&&u.password===pass);if(!found||!found.active){toast('E-posta, şifre veya hesap durumu doğrulanamadı.',true);return}found.lastLogin=now();user={id:found.id,name:found.name,email:found.email,role:found.role,active:found.active};sessionStorage.setItem(SESSION,JSON.stringify(user));audit('Giriş','Yerel çevrimdışı oturum açıldı.');page='dashboard';layout();toast('Giriş başarılı.')};
    window.logout=()=>{audit('Çıkış','Yerel oturum kapatıldı.');sessionStorage.removeItem(SESSION);user=null;page='dashboard';layout()};window.go=(p)=>{page=p;selectedAssignment=null;layout()};
    window.showNotifications=()=>{let ns=db.notifications.slice(0,8);ns.forEach(n=>n.read=true);save();modal('Bildirimler',ns.length?`<div>${ns.map(n=>`<div class="report-card"><b>${esc(n.text)}</b><br><span class="small">${esc(n.when)}</span></div>`).join('')}</div>`:'<div class="empty">Yeni bildirim yok.</div>');layout()};
    function modal(title,body){document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><b>${title}</b><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`}window.closeModal=()=>document.querySelector('#modalRoot').innerHTML='';
    window.trainingModal=(id)=>{let t=id?getTraining(id):{code:'',title:'',description:'',target:'',objectives:'',duration:'',owner:'',link:'',attachment:'',version:'1.0',date:new Date().toISOString().slice(0,10),archived:false};modal(id?'Eğitimi düzenle':'Yeni eğitim',`<form onsubmit="saveTraining(event,${id||0})"><div class="form-grid"><div class="field"><label>Eğitim kodu</label><input name="code" value="${esc(t.code)}" required></div><div class="field"><label>Eğitim adı</label><input name="title" value="${esc(t.title)}" required></div><div class="field full"><label>Açıklama</label><textarea name="description" required>${esc(t.description)}</textarea></div><div class="field"><label>Hedef kitle</label><input name="target" value="${esc(t.target)}" required></div><div class="field"><label>Süre</label><input name="duration" value="${esc(t.duration)}" required></div><div class="field full"><label>Öğrenme amaçları</label><textarea name="objectives" required>${esc(t.objectives)}</textarea></div><div class="field"><label>Sorumlu birim</label><input name="owner" value="${esc(t.owner)}" required></div><div class="field"><label>Sürüm</label><input name="version" value="${esc(t.version)}" required></div><div class="field"><label>Bağlantı</label><input name="link" value="${esc(t.link)}"></div><div class="field"><label>Dosya/görsel adı</label><input name="attachment" value="${esc(t.attachment)}"></div><div class="field"><label>Tarih</label><input type="date" name="date" value="${t.date}" required></div></div><button class="btn btn-primary">Kaydet</button></form>`)};
    window.saveTraining=(ev,id)=>{ev.preventDefault();let f=new FormData(ev.target),data=Object.fromEntries(f.entries());if(id){Object.assign(getTraining(id),data);audit('Eğitim güncellendi',data.title)}else{db.trainings.push({id:newId(db.trainings),...data,archived:false});audit('Eğitim oluşturuldu',data.title)}save();closeModal();layout();toast('Eğitim kaydedildi.')};window.archiveTraining=(id)=>{let t=getTraining(id);t.archived=!t.archived;audit(t.archived?'Eğitim arşivlendi':'Eğitim yeniden açıldı',t.title);save();layout()};
    window.userModal=(id)=>{let u=id?getUser(id):{name:'',email:'',role:'EVALUATOR',active:true,password:'Demo!2026Egitim'};modal(id?'Kullanıcıyı düzenle':'Kullanıcı ekle',`<form onsubmit="saveUser(event,${id||0})"><div class="field"><label>Ad soyad</label><input name="name" value="${esc(u.name)}" required></div><div class="field"><label>E-posta</label><input type="email" name="email" value="${esc(u.email)}" required></div><div class="field"><label>Rol</label><select name="role"><option value="EVALUATOR" ${u.role==='EVALUATOR'?'selected':''}>Değerlendirici</option><option value="ADMIN" ${u.role==='ADMIN'?'selected':''}>Yönetici</option></select></div>${id?'':`<div class="field"><label>İlk şifre</label><input name="password" value="Demo!2026Egitim" required></div>`}<button class="btn btn-primary">Kaydet</button></form>`)};
    window.saveUser=(ev,id)=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target).entries());if(db.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase()&&u.id!==id)){toast('Bu e-posta adresi zaten kayıtlı.',true);return}if(id){Object.assign(getUser(id),d);audit('Kullanıcı güncellendi',d.name)}else{db.users.push({id:newId(db.users),...d,active:true,lastLogin:null});audit('Kullanıcı oluşturuldu',d.name)}save();closeModal();layout();toast('Kullanıcı kaydedildi.')};window.toggleUser=(id)=>{let u=getUser(id);if(u.id===user.id){toast('Kendi hesabınızı bu ekrandan pasifleştiremezsiniz.',true);return}u.active=!u.active;audit('Hesap durumu değiştirildi',u.name);save();layout()};window.resetPassword=(id)=>{let u=getUser(id);u.password='Demo!2026Egitim';audit('Parola sıfırlandı',u.name);save();toast('Parola demo şifresine sıfırlandı.')};
    window.assignmentModal=()=>{let ts=db.trainings.filter(t=>!t.archived),es=db.users.filter(u=>u.role==='EVALUATOR'&&u.active);modal('Değerlendiricilere toplu atama',`<form onsubmit="saveAssignment(event)"><div class="field"><label>Eğitim</label><select name="trainingId">${ts.map(t=>`<option value="${t.id}">${esc(t.code)} · ${esc(t.title)}</option>`).join('')}</select></div><div class="field"><div class="split"><label>Değerlendiriciler</label><label class="small"><input type="checkbox" onchange="toggleAllEvaluators(this.checked)"> Tümünü seç</label></div><div id="bulkEvaluators" style="max-height:220px;overflow:auto;border:1px solid #dce7ee;border-radius:8px;padding:8px;background:#f8fbfd">${es.map(u=>`<label style="display:flex;gap:9px;align-items:center;padding:8px 6px;cursor:pointer"><input type="checkbox" name="evaluatorIds" value="${u.id}"><span><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></span></label>`).join('')}</div><p class="small">Bir veya birden fazla değerlendirici seçin. Daha önce atanmış kişiler otomatik olarak atlanır.</p></div><div class="field"><label>Son teslim tarihi</label><input type="date" name="due" value="${day(7)}" required></div><button class="btn btn-primary">Seçilen değerlendiricilere ata</button></form>`) };
    window.toggleAllEvaluators=(checked)=>document.querySelectorAll('#bulkEvaluators input[name="evaluatorIds"]').forEach(input=>input.checked=checked);
    window.saveAssignment=(ev)=>{ev.preventDefault();let f=new FormData(ev.target),trainingId=+f.get('trainingId'),due=String(f.get('due')||''),evaluatorIds=[...new Set(f.getAll('evaluatorIds').map(Number).filter(Boolean))],training=getTraining(trainingId);if(!evaluatorIds.length){toast('Atama oluşturmak için en az bir değerlendirici seçin.',true);return}let pending=evaluatorIds.filter(id=>!db.assignments.some(a=>a.trainingId===trainingId&&a.evaluatorId===id)),duplicateCount=evaluatorIds.length-pending.length;if(!pending.length){toast('Seçilen değerlendiricilerin tamamı bu eğitime zaten atanmış.',true);return}pending.forEach(evaluatorId=>db.assignments.push({id:newId(db.assignments),trainingId,evaluatorId,due,status:'PENDING',createdAt:new Date().toISOString().slice(0,10)}));audit('Toplu değerlendirici ataması',`${training.title} → ${pending.map(evaluator).join(', ')}`);save();closeModal();layout();toast(`${pending.length} atama oluşturuldu.${duplicateCount?` ${duplicateCount} mükerrer atama atlandı.`:''}`)};window.removeAssignment=(id)=>{let a=getAssignment(id);if(!confirm('Bu atama ve ilişkili değerlendirme silinsin mi?'))return;db.assignments=db.assignments.filter(x=>x.id!==id);db.evaluations=db.evaluations.filter(x=>x.assignmentId!==id);audit('Atama kaldırıldı',getTraining(a.trainingId).title);save();layout()};
    window.openAssignment=(id)=>{let a=getAssignment(id);if(user.role==='EVALUATOR'&&a.evaluatorId!==user.id){toast('Bu atamaya erişim yetkiniz yok.',true);return}selectedAssignment=id;page='evaluate';layout()};window.trainingInfo=(id)=>{let t=getTraining(id);modal('Eğitim Bilgileri',`<div class="info-list"><div class="key">Eğitim adı</div><div>${esc(t.title)}</div><div class="key">Kod / sürüm</div><div>${esc(t.code)} · ${esc(t.version)}</div><div class="key">Açıklama</div><div>${esc(t.description)}</div><div class="key">Hedef kitle</div><div>${esc(t.target)}</div><div class="key">Öğrenme amaçları</div><div>${esc(t.objectives)}</div><div class="key">Süre</div><div>${esc(t.duration)}</div><div class="key">Sorumlu</div><div>${esc(t.owner)}</div><div class="key">Bağlantı</div><div>${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.link)}</a>`:'—'}</div><div class="key">Dosya/görsel</div><div>${esc(t.attachment||'—')}</div><div class="key">Tarih</div><div>${date(t.date)}</div></div>`)};
    window.saveEvaluation=(ev,id,state)=>{ev.preventDefault();let a=getAssignment(id);if(a.evaluatorId!==user.id){toast('Bu atama için değerlendirme yapma yetkiniz yok.',true);return}let old=db.evaluations.find(e=>e.assignmentId===id),responses=CRITERIA.map((_,i)=>+document.querySelector(`input[name=score${i}]:checked`)?.value||0),comments=CRITERIA.map((_,i)=>document.querySelector('#comment'+i)?.value.trim()||'');if(state==='COMPLETED'&&responses.some(x=>!x)){toast('Tamamlamak için tüm kriterleri puanlayın.',true);return}let e=old||{id:newId(db.evaluations),assignmentId:id};Object.assign(e,{status:state,responses,comments,updatedAt:new Date().toISOString()});if(!old)db.evaluations.push(e);a.status=state;audit(state==='COMPLETED'?'Değerlendirme tamamlandı':'Taslak kaydedildi',getTraining(a.trainingId).title);save();toast(state==='COMPLETED'?'Değerlendirme tamamlandı.':'Taslak kaydedildi.');page='assignments';selectedAssignment=null;layout()};
    window.changePassword=(ev)=>{ev.preventDefault();let old=document.querySelector('#oldPassword').value,n=document.querySelector('#newPassword').value,u=getUser(user.id);if(u.password!==old){toast('Mevcut şifre doğrulanamadı.',true);return}if(!(/(?=.*[a-zçğıöşü])(?=.*[A-ZÇĞİÖŞÜ])(?=.*\d)(?=.*[^\w\s]).{12,}/.test(n))){toast('Parola güç kurallarını karşılamıyor.',true);return}u.password=n;audit('Parola değiştirildi','Yerel parola güncellendi.');save();ev.target.reset();toast('Parolanız güncellendi.')};
    window.openReport=(id)=>{let a=getAssignment(id),t=getTraining(a.trainingId),e=db.evaluations.find(x=>x.assignmentId===id),w=window.open('','_blank');if(!w){toast('Rapor penceresi engellendi. Tarayıcı izinlerini kontrol edin.',true);return}let avg=score(e);w.document.write(`<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>${esc(t.title)} — Değerlendirme Raporu</title><style>body{font-family:Arial,sans-serif;color:#102a43;margin:45px;line-height:1.5}h1{color:#07345a}h2{margin-top:30px;color:#075e67;border-bottom:1px solid #dce7ee;padding-bottom:7px}.meta{background:#f4f8fb;padding:18px;border-radius:9px}.k{border:1px solid #dce7ee;border-radius:8px;padding:13px;margin:10px 0}.score{float:right;background:#e1f7f6;padding:4px 8px;border-radius:8px;font-weight:bold}@media print{body{margin:20px}}</style></head><body><p style="color:#0ca6a6;font-weight:bold;letter-spacing:1px">E/V EĞİTİM İÇERİK DEĞERLENDİRME</p><h1>${esc(t.title)}</h1><div class="meta"><b>Kod:</b> ${esc(t.code)}<br><b>Değerlendirici:</b> ${esc(evaluator(a.evaluatorId))}<br><b>Tarih:</b> ${new Date(e.updatedAt).toLocaleDateString('tr-TR')}<br><b>Genel ortalama:</b> ${avg.toFixed(2)}/5 (${Math.round(avg*20)}/100)</div><h2>Kriter bazlı değerlendirme</h2>${CRITERIA.map((c,i)=>`<div class="k"><span class="score">${e.responses[i]}/5</span><b>${c[0]} · ${c[1]}</b><p>${esc(e.comments[i]||'Yorum girilmedi.')}</p></div>`).join('')}<p style="margin-top:30px;font-size:11px;color:#668094">Bu rapor çevrimdışı E/V Eğitim Değerlendirme sürümü tarafından yerel veriden oluşturulmuştur.</p></body></html>`);w.document.close();setTimeout(()=>w.print(),250)};
    window.exportData=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ev-egitim-cevrimdisi-veri.json';a.click();URL.revokeObjectURL(a.href);audit('Veri dışa aktarıldı','Yerel veri JSON olarak indirildi.');toast('Yerel veri dışa aktarıldı.')};window.importData=(ev)=>{let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.users||!d.trainings||!d.assignments||!d.evaluations)throw Error();db=d;save();audit('Veri içe aktarıldı','Yerel JSON kaydı içe aktarıldı.');layout();toast('Yerel veri içe aktarıldı.')}catch{toast('Geçerli bir E/V çevrimdışı veri dosyası seçin.',true)}};r.readAsText(f)};window.resetData=()=>{if(!confirm('Tüm yerel veriler silinip demo verileri yeniden yüklensin mi?'))return;db=seed();save();sessionStorage.removeItem(SESSION);user=null;page='dashboard';layout();toast('Yerel veriler sıfırlandı.')};
    layout();
  })();
  </script>
</body>
</html>
